name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase1-reference-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest
      - name: Canonical smoke run
        run: |
          ns-sim normalize examples/phase1-periodic-vortex.json >/tmp/normalized.json
          NS_SIM_SOURCE_REVISION="$GITHUB_SHA" ns-sim verify-repeat examples/phase1-periodic-vortex.json --output /tmp/ns-sim-repeat
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/ns-sim-repeat/repeat-verification.json').read_text())
          assert report['bitwise_match'] is True
          assert report['reproducibility_class'] == 'R2'
          PY
