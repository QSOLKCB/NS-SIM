[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ns-sim"
version = "0.1.0"
description = "Deterministic canonical 2D incompressible Navier-Stokes reference runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Trent Slade"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
cuda12 = ["cupy-cuda12x>=14,<15"]
cuda13 = ["cupy-cuda13x>=14,<15"]

[project.scripts]
ns-sim = "ns_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
